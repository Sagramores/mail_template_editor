<!DOCTYPE html>
<html lang="[[lang]]" dir="[[dir]]" xmlns="http://www.w3.org/1999/xhtml">
<head>
<meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta http-equiv="X-UA-Compatible" content="IE=edge" />
<title>[[title]]</title>
<style type="text/css">
  body { margin:0; padding:0; background-color:[[page_bg]]; -webkit-text-size-adjust:100%; }
  table { border-collapse:collapse; }
  img { border:0; -ms-interpolation-mode:bicubic; }
  .mte-content a { color:[[link_color]]; }
  .mte-footer a { color:[[footer_text]]; }
  @media only screen and (max-width: 640px) {
    .mte-container { width:100% !important; }
    .mte-pad { padding-left:16px !important; padding-right:16px !important; }
    .mte-col { display:block !important; width:100% !important; }
  }
</style>
</head>
<body style="margin:0;padding:0;background-color:[[page_bg]];">
<div style="display:none;max-height:0;overflow:hidden;opacity:0;">[[preheader]]</div>
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:[[page_bg]];">
  <tr>
    <td align="center" style="padding:24px 10px;">
      <table role="presentation" class="mte-container" width="[[width]]" cellpadding="0" cellspacing="0" border="0" style="width:[[width]]px;max-width:[[width]]px;">
        <!-- Header -->
        <tr>
          <td class="mte-pad" align="[[logo_align]]" style="background-color:[[header_bg]];padding:22px 30px;border-radius:[[radius]]px [[radius]]px 0 0;border-bottom:4px solid [[accent]];font-family:[[font]];color:[[header_text]];">
            [[logo]]
          </td>
        </tr>
        <!-- Content -->
        <tr>
          <td class="mte-pad mte-content" style="background-color:[[content_bg]];padding:30px 30px 20px;border-left:1px solid [[border_color]];border-right:1px solid [[border_color]];font-family:[[font]];font-size:[[font_size]]px;line-height:[[line_height]];color:[[text_color]];text-align:left;">
            [[content]]
          </td>
        </tr>
        <!-- Footer -->
        <tr>
          <td class="mte-pad mte-footer" align="center" style="background-color:[[footer_bg]];padding:24px 30px;border-radius:0 0 [[radius]]px [[radius]]px;font-family:[[font]];font-size:[[small_size]]px;line-height:1.6;color:[[footer_text]];">
            <!--mte:if footer_columns-->[[footer_columns]]<div style="height:14px;line-height:14px;">&nbsp;</div><!--mte:endif-->
            <!--mte:if social--><div style="padding-bottom:10px;">[[social]]</div><!--mte:endif-->
            <!--mte:if footer--><div style="padding-bottom:8px;">[[footer]]</div><!--mte:endif-->
            <a href="{shop_url}" style="color:[[footer_text]];text-decoration:none;font-weight:bold;">{shop_name}</a>
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
</body>
</html>
